# Builds the MCP server images and publishes them to GitHub Container Registry
# so SAS RAM can pull them as Container MCP Server templates:
#   ghcr.io/<owner>/moce-document-processing:latest
#   ghcr.io/<owner>/moce-verify-claims:latest
#
# After the first publish, make the packages public (GitHub → Packages →
# package → Package settings → Change visibility) or configure RAM with
# registry credentials.

name: publish-mcp-images

on:
  push:
    branches: [main, "claude/**"]
    paths: ["mcp/**", ".github/workflows/publish-mcp.yml"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: moce-document-processing
            context: mcp/document_processing
          - name: moce-verify-claims
            context: mcp/verify_claims
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # GHCR occasionally rejects provenance manifest pushes with
          # "unknown blob" — plain image manifests avoid it
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
